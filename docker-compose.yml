name: circulo-lectura-entrega

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-circulo}
      POSTGRES_USER: ${POSTGRES_USER:-circulo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circulo_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: ./api
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-circulo}
      POSTGRES_USER: ${POSTGRES_USER:-circulo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circulo_local}
      SEED_EMAIL: ${SEED_EMAIL:-demo@example.com}
      SEED_PASSWORD: ${SEED_PASSWORD:-LecturaDemo2026!}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 15

  web:
    build:
      context: ./web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data: